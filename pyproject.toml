[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decursio"
version = "0.1.0"
description = "Polygon quote ingestion, order-book imbalance signals, DuckDB storage, and Dash monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Decursio contributors" }]
dependencies = [
    "dash>=2.14.0",
    "duckdb>=1.0.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
decursio-ingest = "decursio.ingestion.runner:main"
decursio-dashboard = "decursio.dashboard.app:main"
decursio-demo = "decursio.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
